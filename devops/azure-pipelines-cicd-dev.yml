# Author: @Aldo Martinez
# Project: DSO-FRONT
name: "$(VersionCodeSWA).$(Rev:r)" # (Not change it)

pr: "none"

####################
# Trigger after any commit to master or feature/** branch
# tags: NO SUPPORTED BY BITBUCKET CLOUD
####################
trigger:
  branches:
    include:
      - "refs/heads/master"
      - "refs/heads/main"
      - "refs/heads/hotfix/*"
  paths:
    include:
      - "*"
    exclude:
      - "readme*"
      - "README*"
      - "Readme*"
      - "docs/*"

####################
# Resources Repository
# ibkteam/dso-template
# branch: master ( Not change it)
####################
resources:
  repositories:
    - repository: "ibkAzTemplates"
      type: "github"
      endpoint: "github-generic-user"
      name: "ibkpe-org/dso-frontend-template"
      ref: "master"

####################
# Call the template of your preference
# check the template out :
# https://bitbucket.org/ibkteam/dso-frontend-template/src/master/
####################
extends:
  template: "src/templates/node-appservice/cicd-dev.yml@ibkAzTemplates"
  parameters:
    projectName: "CSE"
    componentName: "cse-eureca-frontend"
    workingDir: "app"
    buildOutputPath: "dist"
    nodeVersion: "20.X"
    azAppServiceSubscription: "gr2c003eurcdev01"
    azAppServiceAppType: "webAppLinux"
    azAppServiceAppName: "wappeu2c003eurcdev01"
    azAppServiceRuntimeStack: "NODE|18-lts"
    flags:
      unitTestsEnabled: true
      sonarEnabled: true
      sonarQualityGateEnabled: true
      jFrogXrayEnabled: true
      fluidAttacksEnabled: true
