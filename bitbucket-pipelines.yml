image: atlassian/default-image:3

pipelines:
  branches:
    develop:
      - step:
          name: 'Init Sync ️‍🔥'
          script:
            - git clone ${BIEREPO}
          artifacts:
            - eureca-frontend/**
      - step:
          name: 'Push on fluidAttacks ️‍🔥'
          script:
            - cd eureca-frontend
            - git config user.name "Bie Dev"
            - git config user.email ${BIEDEV}
            - git checkout develop
            - git pull origin develop
            - git fetch origin develop fluidattacks-security-scan
            - changes=$(git diff --name-only origin/develop origin/fluidattacks-security-scan)
            - |
              if [ -n "$changes" ]; then
                git checkout fluidattacks-security-scan
                git rm -rf .
                git checkout develop -- .
                git add .
                git commit -m "Sync base source"
                git push origin fluidattacks-security-scan
              else
                echo "No hay cambios en la rama develop. La rama fluidattacks ya está actualizada."
              fi
