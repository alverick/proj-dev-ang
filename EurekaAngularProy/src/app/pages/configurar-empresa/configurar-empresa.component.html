<div class="body">
    <div class="container py-4">            
        <div class="row py-4">
          <!--////// L E F T /////-->
          <div class="col-5">
              <h1 class="texto-azulbase">Mantén actualizada tu información de empresa</h1>
          </div>

          <!--///// R I G H T //// -->

          <div class="col-10 col-md-7" >
              <div class="shadow-none border p-5 bg-white rounded">
                    <form [formGroup]="formGroup" novalidate (ngSubmit)="onSubmit(formGroup.value)" class="form">
                        <mat-form-field class="example-full-width">
                                <input matInput [readonly]="true" placeholder="RUC">
                        </mat-form-field>
                            
                        <mat-form-field class="example-full-width">
                            <input matInput [readonly]="true" type="text" placeholder="Nombre Empresa">
                        </mat-form-field>
            
                        <mat-form-field class="example-full-width">
                            <input matInput [readonly]="true" type="text" placeholder="Rubro">
                        </mat-form-field>
            
                        <mat-form-field  class="example-full-width">
                            <input matInput type="email" placeholder="Email" formControlName="email" [class.is-invalid]="f.email.invalid">
                            <mat-error *ngIf="!formGroup.controls['email'].valid || formGroup.controls['email'].touched">
                                {{ getErrorEmail() }}
                            </mat-error>
                        </mat-form-field>

                        <mat-form-field  class="example-full-width">
                                <input matInput type="text" placeholder="Télefono" formControlName="phone" [class.is-invalid]="f.phone.invalid">
                                <mat-error *ngIf="!formGroup.controls['phone'].valid || formGroup.controls['phone'].touched">
                                    {{ getErrorPhone() }}
                                </mat-error>
                            </mat-form-field>
                        
                        <mat-form-field  class="example-full-width">
                            <input matInput type="password" placeholder="Contraseña Actual" formControlName="password" [class.is-invalid]="f.password.invalid">
                            <mat-error *ngIf="!formGroup.controls['password'].valid || formGroup.controls['password'].touched">
                                {{ getErrorPassword() }}
                              </mat-error>
                        </mat-form-field>
                        
                        <mat-form-field  class="example-full-width">
                                <input matInput type="password" placeholder="Nueva Contraseña" formControlName="newPassword"  [class.is-invalid]="f.newPassword.invalid">
                                <mat-error *ngIf="!formGroup.controls['newPassword'].valid || formGroup.controls['newPassword'].touched">
                                    {{ getErrorNewPassword() }}
                                  </mat-error>
                        </mat-form-field>

                        <mat-form-field  class="example-full-width">
                                <input matInput type="password"  placeholder="Confirmar Nueva Contraseña" formControlName="confirmNewPassword" [class.is-invalid]="f.confirmNewPassword.invalid">
                                <mat-error *ngIf="!formGroup.controls['confirmNewPassword'].valid || formGroup.controls['confirmNewPassword'].touched">
                                    {{ getErrorConfirmNewPassword() }}
                                  </mat-error>
                                  <mat-error *ngIf="f.confirmNewPassword.invalid">Debe ser igual a Contraseña</mat-error>

                        </mat-form-field>

                        <div  class="mt-4"    >
                              <button color="primary" type="submit" class="mano focus-elements btn-big w-100 btn-eureca btn-eureca-amarillo text-white"  >Submit Form</button>
                        </div>
                    </form>
            </div>
        </div>
    </div>
</div>
