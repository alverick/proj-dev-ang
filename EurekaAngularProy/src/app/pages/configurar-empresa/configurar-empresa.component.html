<div class="body">
    <div class="container py-4">            
        <div class="row py-4">
          <!--////// L E F T /////-->
          <div class="col-5">
              <h1 class="texto-azulbase">Mantén actualizada tu información de empresa</h1>
          </div>

          <!--///// R I G H T //// -->

          <div class="col-10 col-md-7" >
              <div class="shadow-none border p-5 bg-white rounded">
                  <form id="configurar-form" class="example-form" [formGroup]="configurarEmpresaForm" (ngSubmit)="submitEnterprise()">
                    <mat-form-field class="example-full-width">
                        <input matInput [readonly]="true" placeholder="RUC">
                    </mat-form-field>
                
                    <mat-form-field class="example-full-width">
                        <input matInput [readonly]="true" type="text" placeholder="Nombre Empresa">
                    </mat-form-field>

                    <mat-form-field class="example-full-width">
                        <input matInput [readonly]="true" type="text" placeholder="Rubro">
                    </mat-form-field>

                    <mat-form-field class="example-full-width" >
                        <input matInput type="email" placeholder="Email" formControlName="email">
                        <mat-error *ngFor="let validation of validations.email">
                            <mat-error class="error-message" *ngIf="configurarEmpresaForm.get('email').hasError(validation.type) && (configurarEmpresaForm.get('email').dirty || configurarEmpresaForm.get('email').touched)">{{validation.message}}</mat-error>
                        </mat-error>
                      </mat-form-field>

                      <mat-form-field class="example-full-width">
                          <input matInput type="tel" placeholder="Teléfono Celular" formControlName="tel">
                      </mat-form-field>

                      <mat-form-field class="example-full-width">
                          <input matInput type="password" placeholder="Contraseña" minlength="6" maxlength="20" formControlName="psw">
                      </mat-form-field>

                      <mat-form-field class="example-full-width">
                          <input matInput type="password" placeholder="Repetir Contraseña" minlength="6" maxlength="20" formControlName="repeatPsw">
                      </mat-form-field>
                      
                      <div class="mt-4">
                           <button style="margin-top: 13px" type="submit" form="configurar-form"class="mano focus-elements btn-big w-100 btn-eureca btn-eureca-amarillo text-white" form="login-form"> Registrarme</button>
                      </div>
                  </form>
            </div>
        </div>
    </div>
</div>
