
<div class="body">
    <div class="container">
        <div class="row"> 
            <div class="col">
                <div class="table-responsive">
                    <!--TODO BIEN HASTA AHI-->
                    <table class="table">
                        <h1 class="h5 mb-3">Movimientos</h1>
                        <div class="my-3 p-3 bg-white rounded shadow-sm"> 
                                <!--//////////// F I L T R O S //////////////// -->
                                <div class="d-flex align-items-center">
                                    <div class="texto-azulbase font-medium"> Filtrar</div>
                                    <div class="pl-2 pr-4">
                                        <span class="icon-filter"></span>
                                    </div>
                                    <!--
                                    <div class="pl-1">
                                        <div class="content-filter">
                                                <span class="icon-search"></span>
                                            <input class="input-filter" type="text" [(ngModel)]="filtro.inputSearch" placeholder="Buscar por nombre o código">
                                        </div>
                                    </div> -->
                                     <!---probando input -->
                                     <div class="pl-1">
                                            <div class="icon-addon addon-md "> 
                                                    <input maxlength="75"  #inputText  class="input-filter" type="text"  [(ngModel)]="filtro.inputSearch" placeholder="Buscar por nombre o código" (keypress)="InputNombreCodigo($event)">
                                                    <label  (click)="limpiarInput()"  class="fa fa-times" ></label> 
                                            </div>
                                    </div> 
                                      
                                </div>  
                            
                                <!--////////// F I L T R O S 2 //////////////////-->
                            <div class="d-flex align-items-center mt-4">
                                <div class="mr-4">
                                    <div class="select-eureca position-relative">
                                        <select class="selectpicker" [(ngModel)]="filtro.service" name="" id="">
                                            <option value="{{item.idType}}"  *ngFor="let item of typeList"> {{item.descripcion}} </option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="mr-4">
                                    <div class="select-eureca position-relative">
                                        <select class="selectpicker" [(ngModel)]="filtro.status" name=""  >
                                            <option value="{{item.idWayPay}}"  *ngFor="let item of waypayList"> {{item.descripcion}} </option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="mr-4">
                                    <div class="select-eureca position-relative">
                                        <select class="selectpicker" [(ngModel)]="filtro.dateForFilter" name=""  >
                                            <option value="{{item.idDate}}"  *ngFor="let item of DateList"> {{item.descripcion}} </option>
                                        </select>
                                    </div>
                                </div> 
                                
                                <div class="mr-4">
                                    <div class="content-input-icon position-relative icon-addon addon-lg">
                                        <mat-form-field>
                                            <input #inputDate1   type="text" class="input-filter" matInput [matDatepicker]="myDatepicker2" [(ngModel)]="filtro.dateFrom" maxlength="10" minlength="10"  (keypress)="numberOnly($event)"    appBlockCopyPaste>
                                            <label  (click)="limpiardate1()"  class="fa fa-times" ></label>
                                            <mat-datepicker-toggle matSuffix [for]="myDatepicker2"></mat-datepicker-toggle>
                                            <mat-datepicker #myDatepicker2></mat-datepicker>
                                           
                                        </mat-form-field>
                                    </div>
                                </div>
                                     
                                <div class="mr-4">
                                    <div class="content-input-icon position-relative icon-addon addon-lg">
                                        <mat-form-field>
                                            <input  #inputDate2 type="text" id="inputDate2" class="input-filter" matInput [matDatepicker]="myDatepicker" [(ngModel)]="filtro.dateTo" maxlength="10" minlength="10"  (keypress)="numberOnly($event)"  appBlockCopyPaste  >
                                            <label  (click)="limpiardate2()"  class="fa fa-times" ></label>
                                            <mat-datepicker-toggle matSuffix [for]="myDatepicker"></mat-datepicker-toggle>
                                            <mat-datepicker #myDatepicker ></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                </div>

                                <div class="texto-azulbase font-medium">
                                    <button class="btn-eureca btn-small btn-eureca-amarillo" (click)="consultaDeuda()">Buscar
                                            <ngx-spinner
                                            bdOpacity = 0.9
                                            bdColor = ""
                                            size = "medium"
                                            color = "#ee7474"
                                            type = "ball-spin-fade"
                                            [fullScreen] = "false"
                                            >
                                            </ngx-spinner>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <!--TODO BIEN-->
                        <div class="my-3 p-3 bg-white rounded shadow-sm">
                        <!--TODO BIEN-->  
                        <thead>
                            <!--//////////// A C C I O N E S //////////////// -->
                            <tr>  
                                    
                                <td colspan="2" class="head">
                                    <div class="d-flex">
                                        <div class="mr-3">   
                                           
                                                <input type="checkbox" class="styled-checkbox" id="styl" value="value1" [(ngModel)]="selectedAll" (change)="SeleccionarTodos($event)" >
                                                <label for="styl" class="text-small font-medium">Seleccionar  Todos</label> 
                                             
                                        </div>
                                                                                          
                                        <div class="mr-3">
                                            <a class="texto-azul" href="" data-toggle="modal" data-target="#ModalDescargar">
                                                <span class="icon-correo-azul iconos-big"></span> <br>
                                                <span class="text-small font-medium">Descargar</span>
                                            </a>
                                        </div>
                                        <div class="mr-3">
                                            <a class="texto-azul" href="javascript:;" (click)="EliminarSeleccionados()" data-toggle="modal" data-target="#ModalNotificacion">
                                                <span class="icon-eliminar iconos-big"></span><br>
                                                <span class="text-small font-medium">Eliminar</span>
                                            </a>
                                        </div>
                                        
                                        <div class="mr-3" > 
                                            <div data-toggle="collapse" data-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
                                                <span class="icon-papel-2 iconos-big"></span><br>
                                                    <span class="text-small font-medium">Cargar Excel</span>
                                            </div>  
                                            <div class="collapse sobresale" id="collapseExample">
                                                <div class="card card-body" >
                                                    <div  *ngFor="let service of services" (click)="openDialog()">
                                                        <div data-toggle="collapse" >
                                                            {{service}} 
                                                        </div>
                                                    </div>        
                                                </div>
                                            </div> 
                                        </div>   
                                    </div>

                                    
                                </td>
                                   
                                <td colspan="8"  class="head">
                                    <pagination-controls (pageChange)="changePage($event)"></pagination-controls>
 
                                </td>
                                
                            </tr>

                            <!--//////////// A C C I O N E S //////////////// -->                            
                            <tr>
                                <th scope="col"></th>                                            
                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">            
                                        <div class="d-inline-block text-center"> Fecha emisión.</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>                                        
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <div class="d-inline-block text-center"> Fecha vto.</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <div class="d-inline-block text-center"> Codigo de Cliente</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>
                                    </div>
                                </th>

                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <div class="d-inline-block text-center"> Nombres</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>
                                    </div>
                                </th>

                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <div class="d-inline-block text-center"> Apellidos</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>
                                    </div>
                                </th>

                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <div class="d-inline-block text-center"> Servicio</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>
                                    </div>
                                </th>

                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <div class="d-inline-block text-center"> Concepto</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>
                                    </div>
                                </th>

                                <th scope="col">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <div class="d-inline-block text-center"> Monto</div>
                                        <div class="d-inline-block ml-1"><span class="icon-arrowtopbottom"></span></div>
                                    </div>
                                </th>
                                  
                            </tr>
                        </thead>
                                
                         
                        </div>
                    </table>
                </div>
        </div>        
    </div>
</div>
</div>
