<div class="content tw-py-0">
  <form
    [formGroup]="debtForm"
    novalidate
    (submit)="grabarNuevo()"
    autocomplete="off"
    class="content"
  >
    <input type="hidden" name="hidden" />
    <div class="tw-text-xs">Agregar cobro del servicio</div>
    <div class="tw-font-medium tw-text-2xl tw-mb-2">
      {{ excelService.service.name }}
    </div>
    <div class="form-row sm:tw-flex tw-gap-2">
      <cs-label-control
        class="tw-w-full"
        formControlName="emissionDate"
        [errorMessages]="formErrors.emissionDate"
      >
        Fecha de emisión
        <p-calendar
          control
          class="tw-w-full"
          styleClass="tw-w-full"
          [iconDisplay]="'input'"
          [showIcon]="true"
          [minDate]="minDate"
          [maxDate]="maxDate"
          formControlName="emissionDate"
          appendTo="body"
          dateFormat="dd/mm/yy"
        ></p-calendar
      ></cs-label-control>
      <cs-label-control
        *ngIf="!isPartial"
        class="tw-w-full"
        formControlName="dueDate"
        [errorMessages]="formErrors.dueDate"
      >
        Fecha de vencimiento
        <p-calendar
          control
          class="tw-w-full"
          styleClass="tw-w-full"
          [iconDisplay]="'input'"
          [showIcon]="true"
          [minDate]="minDate"
          [maxDate]="maxDate"
          appendTo="body"
          formControlName="dueDate"
          dateFormat="dd/mm/yy"
        ></p-calendar
      ></cs-label-control>
    </div>
    <div class="form-row">
      <cs-label-control
        class="tw-w-full"
        formControlName="code"
        [errorMessages]="formErrors.code"
      >
        Código
        <div class="tw-w-full tw-relative" control>
          <input
            type="text"
            class="tw-w-full"
            pInputText
            pKeyFilter="alphanum"
            [maxLength]="20"
            formControlName="code"
          />
          <span
            *ngIf="loaderDebtorCode"
            class="tw-absolute tw-right-4 tw-text-extended-grey-2 tw-text-xs tw-flex tw-items-center tw-gap-2 tw-top-1/2 -tw-translate-y-1/2 tw-pointer-events-none"
            >Buscando...<i
              class="pi pi-spin pi-spinner tw-text-primary-green-1"
            ></i
          ></span>
        </div>
      </cs-label-control>
    </div>
    <div class="form-row">
      <cs-label-control
        formControlName="firstName"
        class="tw-w-full"
        [errorMessages]="formErrors.firstName"
      >
        Nombre
        <input
          type="text"
          class="tw-w-full"
          pInputText
          minlength="3"
          [pKeyFilter]="validNameRegex"
          [maxLength]="80"
          formControlName="firstName"
        />
      </cs-label-control>
      <cs-message-alert *ngIf="debtorExistent" class="" mode="info"
        ><div class="tw-text-xs">
          El código deudor ingresado ya esta registrado, no se puede cambiar el
          nombre.
        </div></cs-message-alert
      >
    </div>
    <ng-container *ngIf="!isPartial">
      <div class="form-row">
        <cs-label-control
          formControlName="concept"
          class="tw-w-full"
          [errorMessages]="formErrors.concept"
        >
          Concepto
          <input
            type="text"
            class="tw-w-full"
            pInputText
            [pKeyFilter]="alphaNumSpaceRegex"
            minlength="2"
            [maxLength]="16"
            formControlName="concept"
          />
        </cs-label-control>
      </div>
      <div class="form-row">
        <cs-label-control
          formControlName="amount"
          class="tw-w-full"
          [errorMessages]="formErrors.amount"
        >
          Monto
          <p-inputNumber
            class="tw-w-full"
            styleClass="tw-w-full"
            mode="decimal"
            [min]="0"
            [max]="limitAmountMax"
            [prefix]="excelService.service.currencySymbol"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
            [placeholder]="amountWithSymbolLabel"
            formControlName="amount"
          />
        </cs-label-control>
      </div>
    </ng-container>
    <div class="tw-flex tw-gap-2 tw-justify-center tw-mt-2">
      <button
        type="submit"
        pButton
        pRipple
        icon="pi pi-save"
        label="Grabar"
        iconPos="right"
      ></button>
      <button
        type="button"
        pButton
        pRipple
        class="p-button-text"
        icon="pi pi-times-circle"
        (click)="cerrarDialog()"
        label="Cerrar"
        iconPos="right"
      ></button>
    </div>
  </form>
</div>
