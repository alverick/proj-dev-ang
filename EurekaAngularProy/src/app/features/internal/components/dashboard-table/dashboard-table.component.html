<div class="tw-shadow tw-px-6 tw-py-5 tw-bg-white">
  <p class="tw-mb-2">Top 10 clientes</p>
  <p-table [value]="customers" styleClass="tw-text-xs">
    <ng-template pTemplate="header">
      <tr class="tw-text-xs">
        <th>Nombre</th>
        <th>Servicio</th>
        <th>Monto total</th>
        <th>Moras</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-customer>
      <tr>
        <td>{{ customer.name }}<br />{{ customer.id }}</td>
        <td>{{ customer.service }}</td>
        <td>{{ customer.totalAmount }}</td>
        <td>{{ customer.delayAmount }}</td>
      </tr>
    </ng-template>
  </p-table>
  <div class="tw-text-center tw-pt-4 tw-text-xs" *ngIf="customers.length === 0">
    Sin registros
  </div>
</div>
