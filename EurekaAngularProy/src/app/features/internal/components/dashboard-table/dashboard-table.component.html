<div
  class="tw-shadow tw-bg-white tw-rounded tw-border-extended-grey-3"
  [ngClass]="{
    'tw-shadow': !printMode,
    'tw-border': printMode,
    'skeleton-background': loading
  }"
>
  <ng-container *ngIf="!loading">
    <div class="tw-px-5 tw-py-4 tw-border-b tw-border-extended-grey-4">
      <p>Top 10 clientes</p>
    </div>
    <div class="tw-px-2 tw-pb-4">
      <p-table [value]="customers" styleClass="tw-text-xs">
        <ng-template pTemplate="header">
          <tr class="tw-text-xs">
            <th>Nombre</th>
            <th>Servicio</th>
            <th>Cobros</th>
            <th>Moras</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-customer>
          <tr>
            <td>
              {{ customer.name }} {{ customer.lastName }}<br />{{
                customer.code
              }}
            </td>
            <td>{{ customer.service | notEmpty : '-' }}</td>
            <td>
              {{ customer.totalAmount | currency : currency | notEmpty : '-' }}
            </td>
            <td>
              {{ customer.totalDefault | currency : currency | notEmpty : '-' }}
            </td>
          </tr>
        </ng-template>
      </p-table>
      <div
        class="tw-text-center tw-text-xs tw-pt-4"
        *ngIf="customers.length === 0"
      >
        Sin registros
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="loading">
    <div class="tw-px-5 tw-py-4 tw-border-b tw-border-extended-grey-4">
      <div class="tw-h-3.5 tw-bg-extended-grey-3 tw-rounded-full tw-w-24"></div>
    </div>
    <div class="tw-pb-1 tw-mx-2">
      <table class="tw-mb-2 tw-w-full">
        <tr class="tw-border-b tw-border-extended-grey-4 tw-h-10">
          <th class="tw-px-4 tw-text-center">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </th>
          <th class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </th>
          <th class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </th>
          <th class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </th>
        </tr>
        <tr class="tw-border-b tw-border-extended-grey-4 tw-h-10">
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
        </tr>
        <tr class="tw-border-b tw-border-extended-grey-4 tw-h-10">
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
        </tr>
        <tr class="tw-border-b tw-border-extended-grey-4 tw-h-10">
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
          <td class="tw-px-4">
            <div
              class="tw-h-2 tw-bg-extended-grey-3 tw-rounded-full tw-w-3/4"
            ></div>
          </td>
        </tr>
      </table>
    </div>
  </ng-container>
</div>
