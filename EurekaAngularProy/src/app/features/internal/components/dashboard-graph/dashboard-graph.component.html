<div
  class="tw-bg-white tw-rounded tw-border-extended-grey-3"
  [ngClass]="{
    'tw-shadow': !printMode,
    'tw-border': printMode,
    'skeleton-background': loading
  }"
>
  <ng-container *ngIf="!loading">
    <div
      class="tw-px-6 tw-py-4 tw-font-medium tw-border-b tw-border-extended-grey-4"
    >
      <p>Recaudación histórica</p>
    </div>
    <div class="tw-px-6 tw-py-4">
      <ng-container *ngIf="serviceData?.labels?.length > 0">
        <p-chart type="bar" [data]="internalData" [height]="height"></p-chart>
      </ng-container>
      <div
        class="tw-text-center tw-text-xs"
        *ngIf="serviceData?.labels?.length === 0"
      >
        Sin registros
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="loading">
    <div class="tw-px-5 tw-py-4 tw-border-b tw-border-extended-grey-4">
      <div class="tw-h-3.5 tw-bg-extended-grey-3 tw-rounded-full tw-w-24"></div>
    </div>
    <div class="tw-px-6 tw-py-4">
      <div
        class="tw-flex tw-items-center tw-justify-center tw-w-full tw-h-72 tw-bg-extended-grey-3 tw-rounded"
      >
        <svg
          class="tw-w-12 tw-h-12 tw-text-extended-grey-4"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          fill="currentColor"
          viewBox="0 0 640 512"
        >
          <path
            d="M480 80C480 35.82 515.8 0 560 0C604.2 0 640 35.82 640 80C640 124.2 604.2 160 560 160C515.8 160 480 124.2 480 80zM0 456.1C0 445.6 2.964 435.3 8.551 426.4L225.3 81.01C231.9 70.42 243.5 64 256 64C268.5 64 280.1 70.42 286.8 81.01L412.7 281.7L460.9 202.7C464.1 196.1 472.2 192 480 192C487.8 192 495 196.1 499.1 202.7L631.1 419.1C636.9 428.6 640 439.7 640 450.9C640 484.6 612.6 512 578.9 512H55.91C25.03 512 .0006 486.1 .0006 456.1L0 456.1z"
          />
        </svg>
      </div>
    </div>
  </ng-container>
</div>
