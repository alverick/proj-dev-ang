<div>
  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-6">
        <div class="texto-azul mb-4">Lista de correo</div>
        <div class="widget lista">
          <div class="content">
            <section class="lista">
              <br />
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th class="c1">
                        <div class="text">Correo</div>
                      </th>
                      <th class="c2" style="text-align: right">
                        <div class="text">Editar</div>
                      </th>
                    </tr>
                  </thead>
                </table>
                <div class="ps-body tw-overflow-auto">
                  <table class="table">
                    <thead class="tw-hidden">
                      <tr>
                        <th class="c1" scope="col">Correo</th>
                        <th class="c2" scope="col">Editar</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr
                        *ngFor="let cor of correos; let i = index"
                        class="border-item"
                        [class.actual]="indiceActual === i"
                      >
                        <td>{{ cor.correo }}</td>
                        <td style="display: flex; float: right">
                          <button
                            type="button"
                            class="icons-correo"
                            (click)="onEditar(cor, i)"
                            [disabled]="Formulario"
                          >
                            <img
                              src="../../../../../assets/images/pencil.svg"
                              alt="editar"
                            />
                          </button>
                          <button
                            type="button"
                            class="icons-correo"
                            (click)="onEliminar(i)"
                            [disabled]="Formulario"
                          >
                            <img
                              src="../../../../../assets/images/eliminar.svg"
                              alt="Eliminar"
                            />
                          </button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <br />
            </section>
          </div>
          <br /><br />
          <div style="text-align: center">
            <button
              type="button"
              [disabled]="Formulario"
              (click)="onAgregar()"
              class="btn-outline-green"
              [class.btn-disabled]="Formulario"
            >
              <span
                ><img
                  *ngIf="!Formulario"
                  class="tw-inline"
                  src="assets/images/plus.svg"
                  alt="Agregar" /><img
                  *ngIf="Formulario"
                  class="tw-inline"
                  src="assets/images/plus-gray.svg"
                  alt="Agregar"
              /></span>
              Agregar otro Mail
            </button>
            <br /><br />
            <button
              type="button"
              [disabled]="Formulario"
              (click)="onGrabarCorreo()"
              class="mt-3 btn-eureca-green text-white"
              [class.btn-disabled]="Formulario"
            >
              FINALIZAR
            </button>
          </div>
          <br /><br />
        </div>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-6">
        <br /><br />
        <div *ngIf="Formulario">
          <div class="d-flex justify-content-end">
            <div class="cuadro-form ppr-5 ppl-5 pt-4 pb-3 bg-white">
              <div class="texto-azul mb-2">
                {{ titleCorreo }}
                <button
                  style="float: right"
                  (click)="Formulario = false; indiceActual = -1"
                  class="mano font-cerrar"
                >
                  <img
                    class="tw-inline"
                    src="assets/images/cerrar.svg"
                    alt="Cerrar"
                  />
                  <br />
                  Cerrar
                </button>
              </div>

              <br />
              <form [formGroup]="frmCorreoGtp" novalidate>
                <div class="form-group">
                  <mat-form-field class="input-text super-full-width">
                    <input
                      formControlName="correo"
                      (Keydown.space)="$event.preventDefault()"
                      [class.is-invalid]="f.correo.invalid"
                      matInput
                      type="text"
                      minlength="10"
                      maxlength="100"
                      placeholder="E-mail"
                      autocomplete="off"
                    />
                    <mat-error
                      class="messsage-error"
                      *ngIf="f.correo.invalid && summited"
                    >
                      {{ getCorreoError() }}
                    </mat-error>
                  </mat-form-field>
                </div>
                <br />
                <br />
                <div class="bnt-cont-reg">
                  <button
                    type="button"
                    class="btn-big btn-eureca-green w-100 text-white"
                    (click)="onGrabar()"
                  >
                    {{ titlebtn }}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
