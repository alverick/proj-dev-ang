<div
  class="tw-bg-no-repeat tw-bg-cover tw-min-w-min tw-min-h-screen container-style tw-flex tw-flex-col"
>
  <div
    class="tw-max-w-6xl tw-w-full tw-m-auto tw-flex tw-justify-center lg:tw-justify-start tw-relative tw-pt-6 lg:tw-pb-10 2xl:tw-pb-20 tw-pb-6 tw-h-24 tw-shrink"
  >
    <a class="lg:tw-pl-24 tw-py-1" [routerLink]="'/'">
      <img
        ngSrc="/assets/images/cs-logo-alternative.svg"
        alt="Cobro Simple"
        height="36"
        width="127"
      />
    </a>
  </div>

  <div
    class="tw-max-w-6xl tw-mx-auto md:tw-flex tw-relative tw-items-center tw-grow"
  >
    <div class="lg:tw-flex tw-items-center">
      <div
        class="sm:tw-w-full sm:tw-max-w-[450px] lg:tw-max-w-none tw-pr-4 tw-pl-4 lg:tw-w-7/12 tw-flex tw-flex-col tw-justify-items-center tw-gap-7"
      >
        <div class="lg:tw-ml-20 lg:tw-mb-0 lg:tw-pr-8 tw-mb-6">
          <h2
            class="tw-text-2xl lg:tw-text-3xl tw-text-center md:tw-text-left xl:tw-text-4xl tw-font-medium tw-text-white"
          >
            Gestiona las cobranzas de tu negocio de manera 100% digital con
            Cobro Simple
          </h2>
        </div>
        <div
          class="tw-w-96 tw-mx-auto tw-mb-10 lg:-tw-mb-2 lg:tw-w-auto tw-max-w-[320px] lg:tw-max-w-[390px]"
        >
          <img src="/assets/images/computer.png" alt="Computadora" />
        </div>
      </div>

      <div class="tw-w-full lg:tw-px-4 lg:tw-w-5/12">
        <div
          class="tw-flex tw-justify-center lg:tw-justify-end tw-pb-10 lg:tw-pb-0"
        >
          <ng-content></ng-content>
        </div>
      </div>
    </div>
  </div>
</div>
