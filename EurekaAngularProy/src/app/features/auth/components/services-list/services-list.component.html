<div class="tw-py-8 tw-w-full tw-px-5 md:tw-px-10 tw-w-full tw-max-w-8xl">
  <div class="sm:tw-flex tw-text-center tw-justify-between">
    <div class="tw-text-lg tw-font-medium">Resumen de tus servicios</div>
    <div class="actions tw-flex tw-gap-2">
      <button
        (click)="add.emit()"
        class="btn-big btn-eureca-green tw-w-56 tw-text-center text-white"
      >
        Agregar otro servicio
      </button>
      <button
        *ngIf="additionalButtons"
        (click)="finish.emit()"
        class="btn-big btn-eureca-green tw-w-56 tw-text-center text-white"
      >
        FINALIZAR
      </button>
    </div>
  </div>
  <div
    class="tw-rounded-md tw-bg-white tw-py-8 tw-my-6 tw-w-full tw-px-10 tw-shadow tw-grid sm:tw-grid-cols-2 lg:tw-grid-cols-3 tw-gap-2 tw-gap-3"
  >
    <ng-content></ng-content>
  </div>
  <div
    class="tw-text-center sm:tw-text-right tw-justify-end tw-mt-10 tw-flex tw-gap-2"
  >
    <button
      *ngIf="additionalButtons"
      (click)="add.emit()"
      class="btn-big btn-eureca-green tw-w-56 tw-text-center text-white"
    >
      Agregar otro servicio
    </button>
    <button
      (click)="finish.emit()"
      class="btn-big btn-eureca-green tw-w-56 tw-text-center text-white"
    >
      FINALIZAR
    </button>
  </div>
</div>
