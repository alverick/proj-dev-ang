<div
  class="tw-bg-primary-green-1 tw-text-center tw-py-4 tw-flex tw-flex-col tw-items-center"
>
  <div class="tw-text-white tw-text-3xl tw-font-medium">
    Configura los servicios de tu empresa
  </div>
  <div class="tw-w-40 tw-py-4">
    <p-steps [model]="steps" [activeIndex]="position"></p-steps>
  </div>
</div>
<div class="tw-max-w-8xl tw-m-auto md:tw-flex tw-relative">
  <cs-sidebar-service
    *ngIf="position!==2"
    class="info tw-relative"
    [position]="position"
    [existServices]="affiliation.servicesList.length > 0"
  ></cs-sidebar-service>
  <router-outlet></router-outlet>
</div>
