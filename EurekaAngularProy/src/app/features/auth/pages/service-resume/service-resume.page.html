<cs-services-list
  class="tw-w-full"
  [empty]="affiliation?.servicesList?.length === 0"
  [message]="'Debes contar con al menos un servicio para continuar.'"
  (add)="createService()"
  (finish)="finalize()"
>
  @for (
    service of affiliation.servicesList;
    track service;
    let position = $index
  ) {
    <cs-service-card
      [serviceData]="service"
      [position]="position"
      (delete)="actionDelete($event)"
      (edit)="actionEdit(position)"
    ></cs-service-card>
  }
</cs-services-list>
<p-sidebar
  [(visible)]="showSidebar"
  [dismissible]="false"
  [closeOnEscape]="false"
  [blockScroll]="true"
  [baseZIndex]="10000"
  (onHide)="closePanel()"
  position="right"
  styleClass="p-sidebar-md edit-form lg:tw-h-screen tw-overflow-auto"
>
  <cs-service-edit-form
    [form]="form"
    [errorMessages]="errorMessages"
    [debtorCodeOptions]="debtorCodeOptions"
    [paymentTypeOptions]="paymentTypeOptions"
    [currencyOptions]="currencyOptions"
    [chargeTypeOptions]="chargeTypeOptions"
    [interestTypeOptions]="interestTypeOptions"
    [formData]="formData"
    (sendForm)="updateService()"
  ></cs-service-edit-form>
</p-sidebar>
