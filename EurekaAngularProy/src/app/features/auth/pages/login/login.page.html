<cs-layout-form>
  <div
    class="tw-bg-white ibk-box-rounded tw-min-w-[320px] sm:tw-min-w-[450px] tw-p-8"
  >
    <div
      class="tw-text-secondary-blue-1 tw-text-2xl lg:tw-text-3xl tw-font-medium tw-text-center mb-4"
    >
      Inicia sesión
    </div>
    <form id="login-form" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <div class="d-flex r-1 pb-3" style="text-align: left">
        <div class="flex-fill mt-2">
          <label class="d-block texto-negro h6">
            <img
              class="tw-inline icon-gb"
              src="../../../../../assets/images/user.svg"
              alt=""
            />
            RUC</label
          >
          <mat-form-field style="height: 1.9px !important; width: 100%">
            <input
              matInput
              class="input-text"
              type="text"
              name="ruc"
              csOnlynumbers
              (focus)="focusFunctionRuc()"
              autocomplete="on"
              minlength="11"
              maxlength="11"
              required
              formControlName="ruc"
              [class.is-invalid]="submitted && f.ruc.errors"
            />
            <mat-error *ngIf="inputUsuaValid" class="messsage-error">
              Debe ingresar el RUC
            </mat-error>
            <mat-error *ngIf="validarCantRuc" class="messsage-error">
              Ingrese un RUC válido de 11 dígitos
            </mat-error>
          </mat-form-field>
          <div class="mt-4">
            <mat-checkbox
              type="checkbox"
              [(ngModel)]="rememberMe"
              autocomplete="on"
              formControlName="rememberme"
            >
              <label class="text-check">Recordar</label>
            </mat-checkbox>
          </div>
        </div>
      </div>

      <div class="d-flex mr-1" style="text-align: left">
        <div class="flex-fill mt-2">
          <label class="d-block texto-negro h6">
            <img
              class="tw-inline icon-gb"
              src="../../../../../assets/images/password.svg"
              alt=""
            />
            Contraseña</label
          >
          <mat-form-field style="height: 1.9px !important; width: 100%">
            <input
              matInput
              class="input-text"
              [type]="hide ? 'password' : 'text'"
              (Keydown.space)="$event.preventDefault()"
              (focus)="focusFunctionPass()"
              minlength="6"
              maxlength="25"
              formControlName="psw"
              [ngClass]="{
                'is-invalid': submitted && f.psw.errors
              }"
              csBlockCopyPaste
            />
            <i
              matSuffix
              (click)="hide = !hide"
              class="pi"
              [ngClass]="{
                'pi-eye': hide,
                'pi-eye-slash': !hide
              }"
            ></i>
            <mat-error *ngIf="inputPassValid" class="messsage-error">
              Debe ingresar el password
            </mat-error>
            <mat-error *ngIf="validarCantPass" class="messsage-error">
              Debes ingresar una contraseña entre 6 y 20 caracteres
            </mat-error>
          </mat-form-field>
          <br /><br />
          <mat-error *ngIf="codigo2" class="messsage-error">
            RUC o Contraseña Incorrecta
          </mat-error>
        </div>
      </div>

      <div class="mb-3" style="text-align: left">
        <small
          id="text-olv"
          [routerLink]="[linkRecoverPassword]"
          (click)="clickRecoverPassword()"
          >Recuperar contraseña
        </small>
      </div>
      <br class="br-none-mobil" />
      <div>
        <button
          pButton
          pRipple
          type="submit"
          class="tw-mb-6 p-button-sm tw-w-72 tw-flex tw-mx-auto tw-justify-center"
          form="login-form"
        >
          Ingresar
        </button>
      </div>
    </form>
    <div class="mb-2">
      <div class="mb-3 dpt" style="text-align: center">
        <label class="text-rg"> ¿No tienes una cuenta?</label>
        <br />
        <ng-container *ngrxLet="disabledAffiliation$ as disabled">
          <button
            pButton
            pRipple
            class="p-button-text p-button-sm tw-text-sm tw-underline"
            pTooltip="Pronto podrás registrarte en Cobro Simple. Estamos trabajando en una nueva experiencia para ti."
            tooltipEvent="focus"
            [tooltipDisabled]="!disabled"
            (click)="clickRegistrarse(disabled)"
          >
            Regístrate aquí
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</cs-layout-form>
