<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark static-top">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img style="max-width: 250px;" src="assets/images/logo.svg" alt="">
        </a>
        <button *ngIf="menu()" class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
               <span class="navbar-toggler-icon"></span>
        </button>
        <div *ngIf="show()" class="collapse navbar-collapse" id="navbarResponsive">

            <ul class="navbar-nav ml-auto">
                <li class="nav-item active px-4">
                    <a class="mano nav-link" [routerLink]="['/home']">Movimientos</a>
                </li>
                <li class="nav-item px-4">
                    <a class="mano nav-link" [routerLink]="['/editarServicios']">Servicios</a>
                </li>
                <li class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" id="lnkMessages" data-toggle="dropdown" aria-haspopup="true"
                      aria-expanded="false">
                      <fa-icon [icon]="notify.icono"></fa-icon>
                    </a>
                    <div class="dropdown-menu scroll-menu dropdown-menu-right" aria-labelledby="lnkMessages"
                      infiniteScroll [infiniteScrollDistance]="8" [infiniteScrollThrottle]="50" (scrolled)="onScroll()"
                      [scrollWindow]="false" (ngShow)="onShowMessages()" >
                      <div *ngFor="let msg of notify.messages" class="dropdown-item " [class.es-nuevo]="msg.isNew" >
                        <div class="texto">{{msg.message}}</div>
                        <div class="tiempo">{{getAgo(msg.create)}}</div>
                        <fa-icon class="item-icono" title="{{msg.title}}" [icon]="msg.icono" (click)="notify.changeRead(msg)" ></fa-icon>
                      </div>
                    </div>
                  </li>
                  <li class="nav-item px-4">
                    <div class="form-inline ml-4 my-lg-0">
                        <div class="btn-group">
                            <a href="#" class="dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <img class="mr-3 icono-perfil" src="assets/images/perfil-blanco.png" alt="Perfil">
                            </a>
                            <div class="dropdown-menu mt-2 dropdown-menu-right">
                                <a class="mano nav-link" [routerLink]="['/configuracionEmpresa']" style="color: black"> Configuración</a>
                                <a class="mano nav-link" (click)="logout()" style="color: black">Cerrar Sesión</a>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
