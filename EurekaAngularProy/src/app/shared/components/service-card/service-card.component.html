<div
  class="tw-h-full tw-rounded-md tw-border tw-py-5 tw-px-8 tw-border-solid tw-border-extended-grey-3 tw-text-extended-ibk-black"
>
  <div
    class="tw-flex tw-justify-between"
    [ngClass]="{
      'tw-pb-2': !update || !canEdit,
      'tw-border-b': !update || !canEdit,
      'tw-border-extended-grey-4': !update || !canEdit
    }"
  >
    <div class="tw-text-lg tw-font-medium tw-truncate tw-mr-2">
      {{ serviceData.name }}
    </div>
    <div class="tw-flex tw-gap-2 tw-flex-shrink-0">
      <div *ngIf="canEdit" (click)="actionEdit()" class="tw-cursor-pointer">
        <img src="../../../../../assets/images/card-icon-edit.svg" />
      </div>
      <div *ngIf="!update" (click)="actionDelete()" class="tw-cursor-pointer">
        <img src="../../../../../assets/images/card-icon-delete.svg" />
      </div>
    </div>
  </div>
  <ng-template [ngIf]="update">
    <div
      *ngIf="serviceData.inReview"
      class="tw-h-8 tw-flex tw-items-center tw-my-1"
    >
      <div
        class="tw-inline tw-text-white tw-rounded-3xl tw-text-xs tw-px-4 tw-py-0.5"
        [ngClass]="{
          'tw-bg-extended-watermelon-1':
            serviceData.name === serviceData.newName,
          'tw-bg-extended-orange-1': serviceData.name !== serviceData.newName
        }"
      >
        <ng-template [ngIf]="serviceData.name === serviceData.newName">
          Debes revisar este servicio</ng-template
        >
        <ng-template [ngIf]="serviceData.name !== serviceData.newName">
          Servicio actualizado</ng-template
        >
      </div>
    </div>
    <div *ngIf="!serviceData.inReview" class="tw-h-8"></div>
  </ng-template>
  <div
    class="tw-grid tw-grid-cols-2 tw-gap-2"
    [ngClass]="{
      'tw-pt-3': !update
    }"
  >
    <div class="tw-text-extended-grey-2">Canales de pago:</div>
    <div class="val">{{ paymentChannels }}</div>
    <div class="tw-text-extended-grey-2">Código de cliente:</div>
    <div class="val tw-overflow-ellipsis tw-overflow-hidden tw-break-all">
      {{ serviceData.debtorCode }}
    </div>
    <div class="tw-text-extended-grey-2">Modalidad:</div>
    <div class="val">{{ dataType }}</div>
    <div class="tw-text-extended-grey-2">Nº Cta. deposito:</div>
    <div class="val">{{ serviceData.accountNumber }}</div>
  </div>
</div>
