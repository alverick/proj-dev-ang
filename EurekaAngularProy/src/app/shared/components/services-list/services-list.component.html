<div class="tw-pt-8 tw-w-full tw-px-5 md:tw-px-10 tw-max-w-8xl">
  <div class="sm:tw-flex tw-text-center tw-items-center tw-justify-between">
    <div class="tw-text-lg tw-font-medium tw-mb-4">
      Resumen de tus servicios
    </div>
    <div class="actions tw-flex tw-justify-center tw-gap-2">
      <button
        pButton
        pRipple
        class="tw-w-full md:tw-w-56"
        type="button"
        *ngIf="!onlyEdit"
        (click)="add.emit()"
        label="Agregar otro servicio"
      ></button>
      <button
        pButton
        pRipple
        class="tw-w-full md:tw-w-56"
        type="button"
        *ngIf="additionalButtons && showSaveAll"
        (click)="finish.emit()"
        label="Finalizar"
      ></button>
    </div>
  </div>
  <div
    class="lg:tw-py-8 tw-mt-6 tw-w-full tw-p-4 lg:tw-px-10 box-shadow sm:tw-grid-cols-2 lg:tw-grid-cols-3 tw-gap-3 tw-grid"
  >
    <div
      *ngIf="empty"
      class="empty tw-text-extended-grey-2 tw-text-3xl tw-text-center tw-flex tw-items-center tw-justify-center tw-col-span-3"
    >
      {{ message }}
    </div>
    <ng-content></ng-content>
  </div>
  <div
    *ngIf="(additionalButtons && !onlyEdit) || showSaveAll"
    class="tw-text-center sm:tw-text-right tw-justify-end tw-mt-10 tw-flex tw-gap-2"
  >
    <button
      pButton
      pRipple
      class="tw-w-full md:tw-w-56"
      type="button"
      *ngIf="additionalButtons && !onlyEdit"
      (click)="add.emit()"
      label="Agregar otro servicio"
    ></button>
    <button
      pButton
      pRipple
      class="tw-w-full md:tw-w-56"
      type="button"
      *ngIf="showSaveAll"
      (click)="finish.emit()"
      label="Finalizar"
    ></button>
  </div>
</div>
