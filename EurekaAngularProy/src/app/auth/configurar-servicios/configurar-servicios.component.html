<div class="body">
    <div class="container">
        <div class="row">
            <div class="col-sm-5">
                <div class="row">
                    <div class="col-sm  "  >
                        <br>
                        <h2 class="texto-azul ">Configura tus servicios </h2>
                        <div class="col-sm-11" style="overflow:auto; max-height:800px">
                            <div class="card-servicios" *ngFor="let svc of afiliacionService.services; let i = index" [class.seleccionado]="indiceActual === i">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-sm-9">
                                            <div class="font-black">{{svc.nombre}}</div>
                                            <mat-error class="messsage-error">Pendiente de aprobación por IBK</mat-error>
                                        </div>
                                        <div class="col-sm-1">
                                            <ul class="list-unstyled position-absolute d-flex flex-row mb-0 tools">
                                                <li *ngIf="!svc.inReview" >
                                                    <a class="texto-azul" style="cursor: pointer" (click)="editService(svc, i)"><i class="icon-lapiz"></i></a>
                                                </li>
                                                <li class="ml-2" *ngIf="afiliacionService.services.length > 1">
                                                    <a class="texto-azul borrar" style="cursor: pointer" (click)="delService(i)"><i class="icon-basura"></i></a>
                                                </li>
                                            </ul>
                                        </div> 
                                    </div>
                                    <table class="table table-sm table-borderless ">
                                            <tr>
                                                <th class="font-black-servicios-list">Canales</th>
                                                <td class="font-black-servicios-des-list">{{ getCanales(svc) }}</td>
                                            </tr> 
                                            <tr>
                                                <th class="font-black-servicios-list">Mora</th>
                                                <td class="font-black-servicios-des-list" *ngIf="svc.cobraMora === 'S' && svc.tipoMora === 'M'">{{ svc.simboloMoneda }} {{ svc.monto }}  </td>
                                                <td class="font-black-servicios-des-list" *ngIf="svc.cobraMora === 'S' && svc.tipoMora === 'P'">{{ svc.porcentaje }} %  </td>
                                                <td class="font-black-servicios-des-list" *ngIf="svc.cobraMora === 'N'">NO  </td>
                                            </tr>
                                            <tr>
                                                <th class="font-black-servicios-list">Cuenta</th>
                                                <td class="font-black-servicios-des-list">{{ svc.nroCuenta }}</td>
                                            </tr>
                                    </table>  
                                </div>  
                            </div> 
                        </div> 
                    </div>
                </div>
                <br>
                <div style="text-align:center;">
                    <button (click)="MostarFormulario()" class=" btn-outline-green">
                      <span class="fa fa-plus-circle"></span>   Agregar otro servicio
                    </button>
                    <br>
                    <br>
                    <button (click)="EnviarServicios()" class="btn-eureca-green text-white">
                     Finalizar</button>
                </div>
            </div>
            <div class="col-sm-7 " *ngIf="Formulario">
                <br> 
                    <div class="formulario p-5 bg-white ">
                        <div style="float: right;" (click)="OcultarFormulario(true)" class="mano font-cerrar">
                                <img  src="assets/images/cerrar.svg">  <br> Cerrar  
                        </div>
                        <app-form-servicio [service]="serviceActual" (grabar)="onGrabar($event)"></app-form-servicio>
                    </div>
                 
                <br>
            </div>
        </div>
    </div >
</div>
