<div class="container-component">
  <div class="row">
    <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
      <ul class="navbar-nav ml-auto" id="btn-regresar-identificar-empresa">
        <li class="nav-item">
          <a
            class="nav-link lnk-regresar mano"
            (click)="goBack()"
            style="display: flex"
          >
            <img src="assets/images/left-blue.svg" />
            <div class="text-regresar">&nbsp;&nbsp;&nbsp;Regresar</div>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-form">
    <div class="block-left">
      <h1 class="texto-azul title-first-part">
        Configura los cobros de tu
        <br class="br-none-mobil" />
        empresa
      </h1>

      <div class="stepper">
        <div class="stepper-step">
          <img class="image-step" src="assets/images/check.svg" />
        </div>
        <div class="stepper-line"></div>
        <div class="stepper-step">
          <img class="image-step" src="assets/images/check.svg" />
        </div>
        <div class="stepper-line"></div>
        <div class="stepper-step">
          <label class="text-step">3</label>
        </div>
        <div class="stepper-line"></div>
        <div class="stepper-step-no-selected">
          <label class="text-step-no-selected">4</label>
        </div>
      </div>
    </div>

    <div class="block-right-part-one">
      <div class="first-part">
        <div class="stepper-step">
          <label class="text-step">3</label>
        </div>
        <p class="text-first-part">
          Elige las opciones de canales de pago que
          <br class="br-none-escritorio" />
          tendrán tus clientes
        </p>
      </div>
      <div class="bg-white cuadro-form">
        <form
          [formGroup]="frm"
          novalidate
          (submit)="onSubmitServicio()"
          class="form-content"
        >
          <!-- Elige las opciones de canales de pago que tendrán tus clientes -->
          <div class="container-canal">
            <!-- Canal Web/App-->
            <div
              class="item-canal"
              [class.seleccionado-card]="f.usaWebApp.value"
            >
              <div class="container-part-1-2">
                <div class="part-canal part-1">
                  <mat-checkbox
                    formControlName="usaWebApp"
                    id="styled-checkbox-1"
                  >
                  </mat-checkbox>
                </div>

                <div class="part-canal part-2 responsive-desktop">
                  <h1 class="title-canal">Web/APP</h1>
                  <h2 class="title-sub-canal">
                    Interbank APP<br />
                    y Banca por <br />internet
                  </h2>
                </div>

                <div class="part-canal part-2 responsive-mobil">
                  <h1 class="title-canal">Web / APP</h1>
                  <h2 class="title-sub-canal">
                    Lima y <br class="br-none-escritorio" />
                    provincias
                  </h2>
                </div>
              </div>

              <div class="part-canal part-3">
                <label class="label-canal">Tu cliente pagará:</label>
                <label class="label-number-canal">S/ 0</label>
                <label class="label-canal">GRATIS</label>
              </div>
            </div>
            <!-- Canal Agente -->
            <div
              class="item-canal"
              [class.seleccionado-card]="f.usaAgente.value"
            >
              <div class="container-part-1-2">
                <div class="part-canal part-1" style=" margin: 0px !important;">
                  <mat-checkbox
                    formControlName="usaAgente"
                    id="styled-checkbox-2"
                    style=" margin: 0px !important;"
                  >
                  </mat-checkbox>
                </div>

                <div class="part-canal part-2">
                  <h1 class="title-canal">Agentes</h1>
                  <h2 class="title-sub-canal">
                    Lima y <br class="br-none-escritorio" />
                    provincias
                  </h2>
                </div>
              </div>

              <div class="part-canal part-3">
                <label class="label-canal">Tu cliente pagará:</label>
                <label class="label-number-canal">
                  {{ currencySymbolSoles }} {{ commissionAgentSoles }}
                </label>
                <label class="label-canal">
                  {{ currencySymbolDollars }} {{ commissionAgentDollars }}
                </label>
              </div>
            </div>
            <!-- Canal Agencias -->
            <div
              class="item-canal"
              [class.seleccionado-card]="f.usaTienda.value"
              *ngIf="useAgencyChannel"
            >
              <div class="container-part-1-2">
                <div class="part-canal part-1">
                  <mat-checkbox
                    formControlName="usaTienda"
                    id="styled-checkbox-3"
                  >
                  </mat-checkbox>
                </div>

                <div class="part-canal part-2">
                  <h1 class="title-canal">Agencias</h1>
                  <h2 class="title-sub-canal">
                    Lima y <br class="br-none-escritorio" />
                    provincias
                  </h2>
                </div>
              </div>

              <div class="part-canal part-3">
                <label class="label-canal">Tu cliente pagará:</label>
                <label class="label-number-canal">
                  {{ currencySymbolSoles }} {{ commissionStoreSoles }}
                </label>
                <label class="label-canal">
                  {{ currencySymbolDollars }} {{ commissionStoreDollars }}
                </label>
              </div>
            </div>
          </div>

          <!-- Siguiente -->
          <div class="bnt-cont-reg">
            <button type="submit" class="btn-eureca-green text-white">
              SIGUIENTE
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
