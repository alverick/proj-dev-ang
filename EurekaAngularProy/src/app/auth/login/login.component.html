<div class="body">
    <div class="container">
        <div class="row">
            <!--/////// L E F T ////////-->
            <div class="col-sm">
                <div class="row">
                    <div class="col-sm">
                        <h1 class="title-landing text-white">Descubre una nueva forma de manejar tus cobros</h1>
                    </div>
                </div>
            </div>

            <!--/////// R I G H T ////////-->
            <div class="col-sm position-relative">
                <div class="d-flex justify-content-center">
                    <div class="shadow-none border p-5 bg-white rounded">
                        <!--/////// F O R M ////////-->
                        <form id="login-form" [formGroup]="loginForm" (ngSubmit)="submitLogin()" >
                            <h3 class="texto-azulbase text-center pb-3 mb-4 font-medium">Iniciar Sesión</h3>
                            <div class="d-flex mb-4">
                                <div class="mr-3">
                                    <span class="icon-usuario"></span>
                                </div>
                                <!-- ////////////// R U C /////////////////// -->
                                <div class="flex-fill">
                                    <label class="d-block texto-negro h6" for="">RUC</label>
                                    <mat-form-field class="full-width">
                                        <input #inputUsua matInput type="text" (focus)="focusFunctionRuc()" minlength="11" maxlength="11" formControlName="ruc" [ngClass]="{ 'is-invalid': submitted && f.ruc.errors }" numbersOnly>
                                            <mat-error  *ngFor="let validation of account_validation_messages.ruc">
                                                <div *ngIf="inputUsuaValid">
                                                <mat-error class="error-message" *ngIf="loginForm.get('ruc').hasError(validation.type) ">
                                                    {{validation.message}}
                                                </mat-error>
                                                </div>
                                            </mat-error> 
                                    </mat-form-field>
                                    <div class="mt-4">
                                        <input class="styled-checkbox" id="styled-checkbox-1" type="checkbox" [checked]="checked" [(ngModel)]="rememberMe" formControlName="rememberme">
                                        <label for="styled-checkbox-1"><span class="ml-2">Recordar</span></label>
                                    </div>
                                </div>
                            </div>



                            <div class="d-flex mb-4">
                                <div class="mr-3">
                                    <span class="icon-acceso"></span>
                                </div>

                                <!-- ////////////// P A S S W O R D /////////////////// -->
                                <div class="flex-fill">
                                    <label class="d-block texto-negro h6" for="">Contraseña</label>
                                    <mat-form-field class="full-width" style="height: 1.9px !important">
                                        <input #inputPass matInput type="password" (focus)="focusFunctionPass()" minlength="6" maxlength="20" formControlName="psw"  [ngClass]="{ 'is-invalid': submitted && f.psw.errors }" appBlockCopyPaste> 
                                            <mat-error *ngFor="let validation of account_validation_messages.psw">
                                                <div *ngIf="inputPassValid">
                                                <mat-error class="error-message" *ngIf="loginForm.get('psw').hasError(validation.type) ">
                                                    {{validation.message}}
                                                </mat-error>
                                                </div>
                                            </mat-error> 
                                    </mat-form-field>
                                </div>
                            </div>

                            <div style="color:#f44336 !important; font-size: 8" *ngIf="codigo2" class="error-message">
                                Usuario o password Incorrecto
                            </div>
                            <br>

                            <re-captcha *ngIf="isTrue" #recaptchaRef="reCaptcha" (resolved)="resolved($event)" siteKey="6LdAxK8UAAAAAFLqBmEXIXF-5F_x99yygkQDMfPL" secretKey="6LdAxK8UAAAAANdVGiLyYxA_FnOj1H7AQbg2XY2g"></re-captcha>

                            <!-- Login -->
                            <button type="submit" class="btn-big w-100 btn-eureca btn-eureca-amarillo text-white" form="login-form" [disabled]="intento6  ? 'disabled': null"> Ingresar</button>

                            <div class="mt-3 text-center">
                                <button class="btn-big w-100 btn-eureca btn-eureca-azul text-white">
                                    <a routerLink="afiliacion" class="nav-link text-white">Registrate</a>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-image-landing d-sm-none d-md-block">
        <img class="img-fluid">
    </div>
</div>
