<div class="body">
    <div class="container py-4">            
        <div class="row py-4">
            <!--/////// L E F T ////////-->
            <div class="col-sm">
                <h1 class="title-landing text-white">Descubre una nueva forma de manejar tus cobros</h1>
            </div>

            <!--/////// R I G H T ////////-->
            <div class="col-sm">
                <div class="position-absolute bg-blanco box-login custom-shadow">
                <!--/////// T I T L E ////////-->
                <h2 class="texto-azulbase text-center pb-3 mb-4 font-medium">Iniciar Sesión</h2>                
                
                <!--/////// F O R M ////////-->
                <form  id="login-form"  [formGroup]="loginForm" (ngSubmit)="submitLogin()" novalidate>
                    <div class="d-flex mb-4">
                        <div class="mr-3">
                            <span class="icon-usuario"></span>
                        </div>
                        
                        <div class="flex-fill">
                            <label class="d-block texto-negro h6" for="">RUC</label>
                            <mat-form-field class="example-full-width">
                                <input matInput formControlName="ruc">
                            </mat-form-field>
                            <mat-error *ngIf="loginForm.get('ruc').errors && loginForm.get('ruc').dirty">
                            </mat-error>
                            <mat-error *ngIf="loginForm.get('ruc').hasError('required')">
                                    Los campos son requeridos 
                            </mat-error>
                            <mat-error *ngIf="loginForm.get('ruc').hasError('minlenght')">

                            </mat-error>
                            
                        </div>
                    </div>
                    
                    <div class="d-flex mb-4">
                        <div class="mr-3">
                            <span class="icon-acceso"></span>
                        </div>
                        <div class="flex-fill">
                            <label class="d-block texto-negro h6" for="">Contraseña</label>
                            <input class="input-line-bottom w-100 font-16" type="password" formControlName="psw" placeholder="***********">
                            <div class="mt-3">
                                <a class="texto-amarillo link-page" href="">¿La olvidaste?</a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Login -->
                    <button type="submit" class="btn-big w-100 btn-eureca btn-eureca-amarillo text-white"
                                form="login-form">
                                Login
                            <!--<a routerLink="home" class="nav-link text-white">Login</a>-->
                    </button>
                     
                    <div class="mt-3 text-center">
                        <button class="btn-big w-100 btn-eureca btn-eureca-azul text-white">
                          
                           <a routerLink="afiliacion" class="nav-link text-white">Registrate</a>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>  
    <div class="bg-image-landing d-sm-none d-md-block">
        <img  class="img-fluid">            
    </div>
</div>
