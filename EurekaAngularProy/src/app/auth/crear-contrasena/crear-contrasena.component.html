<div class="body">
    <div class="container">
        <br />
        <div class="row">
            <div class="col-sm-4">
                <div class="row">
                    <div class="col-sm">
                        <h2 class="texto-azulbase">Crea una contraseña <br> para guardar tus <br> registros</h2>
                    </div>
                </div>
            </div>
            <div class="col-sm-8 position-relative">
                <div class="d-flex justify-content-center">
                    <div class=" border p-5 bg-white rounded">
                        <form [formGroup]="registerForm" novalidate (submit)="onSubmit()">
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="ruc" [class.is-invalid]="f.ruc.invalid" matInput type="text" placeholder="RUC" appOnlynumbers minlength="11" maxlength="11">
                                    <mat-error *ngIf="f.ruc.invalid">RUC es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="nombre"  appSearch [class.is-invalid]="f.nombre.invalid" matInput type="text" placeholder="Nombre de tu empresa" minlength="3" maxlength="80">
                                    <mat-error *ngIf="f.nombre.invalid">Nombre es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width">
                                    <mat-label>Rubro de tu empresa</mat-label>
                                    <mat-select formControlName="rubro">
                                        <mat-option>Rubro de Servicio</mat-option>
                                        <mat-option *ngFor="let r of rubros" [value]="r.code">
                                            {{r.name}}
                                        </mat-option>
                                    </mat-select>
                                    <mat-error *ngIf="f.rubro.invalid && f.rubro.hasError('required')">Elija una opcion</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="email"  appCorreo [class.is-invalid]="f.email.invalid" matInput type="email" placeholder="Email">
                                    <mat-error *ngIf="f.email.invalid">Email es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="telefono" appOnlynumbers [class.is-invalid]="f.telefono.invalid" matInput type="text" placeholder="Telefono ó Celular" minlength="6" maxlength="11">
                                    <mat-error *ngIf="f.telefono.invalid">Telefono es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="contrasena" minlength="6" maxlength="20" [class.is-invalid]="f.contrasena.invalid" matInput type="password" placeholder="Contraseña">
                                    <mat-error *ngIf="f.contrasena.invalid">Contraseña es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="repcontrasena"  minlength="6" maxlength="20" [class.is-invalid]="f.repcontrasena.invalid" matInput type="password" placeholder="Repita Contraseña">
                                    <mat-error *ngIf="f.repcontrasena.invalid">Debe ser igual a Contraseña</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <input formControlName="acceptterms" class="styled-checkbox" id="styled-checkbox-1" type="checkbox">
                                <label for="styled-checkbox-1"> Acepto los Terminos y Condiciones </label>
                            </div>
                            <button type="submit" class="btn-big w-100 btn-eureca btn-eureca-amarillo text-white">
                Registrarme</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
