<div class="body">
    <div class="container">
        <br />
        <div class="row"> 
            <div class="col-sm-4">
                <div class="row">
                    <div class="col-sm">
                        <h2 class="texto-azulbase">Crea una contraseña <br> para guardar tus <br> registros</h2>
                    </div>
                </div>
            </div>
            <div class="col-sm-8 position-relative">
                <div class="d-flex justify-content-center">
                    <div class=" border p-5 bg-white rounded">
                        <form [formGroup]="registerForm" novalidate (submit)="onSubmit()">    
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="ruc" [class.is-invalid]="f.ruc.invalid" matInput type="text" placeholder="RUC" digitOnly minlength="11" maxlength="11">
                                    <mat-error *ngIf="f.ruc.invalid">RUC es un campo requerido</mat-error>
                                </mat-form-field>    
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="email" [class.is-invalid]="f.email.invalid" matInput type="text" placeholder="Email">
                                    <mat-error *ngIf="f.email.invalid">Email es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="telefono" [class.is-invalid]="f.telefono.invalid" matInput type="text" placeholder="Telefono ó Celular" digitOnly maxlength="11">
                                    <mat-error *ngIf="f.telefono.invalid">Telefono es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="contrasena" [class.is-invalid]="f.contrasena.invalid" matInput type="password" placeholder="Contraseña" >
                                    <mat-error *ngIf="f.contrasena.invalid">Contraseña  es un campo requerido</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <mat-form-field class="super-full-width ">
                                    <input formControlName="repcontrasena" [class.is-invalid]="f.repcontrasena.invalid" matInput type="password" placeholder="Repita Contraseña" >
                                    <mat-error *ngIf="f.repcontrasena.invalid">Debe ser igual a Contraseña</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="form-group">
                                <input formControlName="acceptterms" class="styled-checkbox" id="styled-checkbox-1" type="checkbox">
                                <label for="styled-checkbox-1"> Acepto los Terminos y Condiciones </label>
                            </div>
                            <button type="submit" class="btn-big w-100 btn-eureca btn-eureca-amarillo text-white"> Registrarme</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
