<body>
    <!-- Navigation -->

    <div class="container-style">
        <div class="container pt-5 pl-5">
            <a class="pl-4 navbar-brand" href="#">
                <img style="max-width: 250px;" src="assets/images/logo-login.svg" alt="">
            </a>
        </div>

        <div class="container">
            <div class="row ">
                <!--/////// L E F T ////////-->

                <div class="col-md-6 pt-5  pl-5">
                    <div class="pl-4  texto-login pt-3">Descubre una nueva forma de manejar tus cobros</div>
                    <div class="pl-4  pt-5">
                        <img class="pt-5" src="assets/images/mujer.svg">
                    </div>
                </div>

                <!--/////// R I G H T ////////-->
                <div class="col-md-6  pb-3">
                    <div class="d-flex justify-content-end"> 
                        <!---LISTO-->

                        <div *ngIf="!formulario"  class="cuadro-form-Listo">
                                <div class="texto-azul  mb-4 ">Crea una <br> nueva contraseña</div>
                               

                                <form id="login-form" [formGroup]="Cambia" (ngSubmit)="SubmitCambia()">

                                        <div class="margen">
                                            <div class=" d-flex    mr-1 pb-3">
                                                    <div class="mr-2">
                                                        <img src="assets/images/password.svg" alt="">
                                                    </div>
                                                    <!-- ////////////// R U C /////////////////// -->
                                                    <div class="flex-fill mt-2 ">
                                                        <label class="d-block texto-negro">Nueva contraseña</label>
                                                        <mat-form-field class="w-100 margen-inputs"  >
                                                                <input matInput class="input-text" type="password"     minlength="6" maxlength="20" formControlName="password"    >
                                                            
                                                                
                                                        </mat-form-field> 
                                                    </div>
                                            </div>
                                            
                                            <div class="d-flex   mr-1 pb-3">
                                                    <div class="mr-2">
                                                        <img src="assets/images/password.svg" alt="">
                                                    </div>
                                                    <!-- ////////////// R U C /////////////////// -->
                                                    <div class="flex-fill mt-2 ">
                                                        <label class="d-block texto-negro">Repite la contraseña</label>
                                                        <mat-form-field class="w-100 margen-inputs"  >
                                                            <input type="password" formControlName="newpassword"  matInput   minlength="10" maxlength="100" >
                                                            
                                                                
                                                        </mat-form-field> 
                                                    </div>
                                            </div>
                                        </div>


                                    <div class="d-flex justify-content-center">
                                        <button type="submit" class="mano focus-elements btn-eureca-green">
                                           INGRESAR
                                        </button>
                                    </div>
                                </form>

                                
                        </div>


                    </div>
                </div>

            </div>
        </div>


    </div>
</body>
