trigger:
  branches:
    include:
      - refs/tags/*

variables:
  vmImageName: ubuntu-20.04
  azureSubscription: 'armpiloto'
  artifactDeploy: '$(Build.SourcesDirectory)/tipocambio-web'
  azureResourceGroup: 'rg-piloto'

  ${{ if contains(variables['Build.SourceBranchName'], 'dev') }}:
    urlbase: 'dev'
    environment: 'Dev'
    webAppName: 'webapp-pilotoibk-fe-eastus2-dev'

  ${{ if contains(variables['Build.SourceBranchName'], 'main') }}:
    urlbase: 'main'
    environment: 'Prod'
    webAppName: 'webapp-pilotoibk-fe-eastus2'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    jobs:
      - job: BuildJob
        displayName: 'Build'
        steps:
          - script: |
              echo "Building the application!"
              # Your build commands go here
            displayName: 'Build the application'
          - script: |
              echo $(build.sourceBranch)
              # Your build commands go here
            displayName: 'show branch'
          - script: VERSION_TAG=`git describe --tags` && echo "##vso[task.setvariable variable=VERSION_TAG]$VERSION_TAG"
            displayName: Set the tag name as an environment variable
          - script: |
              echo $(VERSION_TAG)
              echo $(build.SourceBranchName)
              echo $(urlbase)
              # Your build commands go here
            displayName: 'show variable ${{variables.urlbase}}'

  - stage: Deploy
    displayName: Deploy stage
    dependsOn: Build
    condition: and(succeeded(), or(eq(variables['urlbase'], 'dev'),eq(variables['urlbase'], 'main')))
    jobs:
      - job: DeployJob
        displayName: 'Deploy'
        steps:
          - script: |
              echo "Deploy the application!"
              # Your build commands go here
            displayName: 'Deploy the application'
