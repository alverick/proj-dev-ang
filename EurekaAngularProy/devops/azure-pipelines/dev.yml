trigger: none
pr: none

variables:
  appServiceConnection: 'gr2c003eurcdev01'
  groupName: 'RG_EU2_C003_EURC_DEV_01'
  appServiceName: 'wappeu2c003eurcdev01'
  vmImageName: 'ubuntu-20.04'

parameters:
  - name: runSonarTask
    default: true
    type: boolean

stages:
- stage: Build
  displayName: Build and push dev
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '16.x'

    - task: Npm@1
      displayName: 'Install angular'
      inputs:
        command: custom
        verbose: false
        customCommand: 'install -g @angular/cli@15'

    - task: Npm@1
      displayName: 'Install npm'
      inputs:
        workingDir: EurekaAngularProy
        verbose: false

    - task: Npm@1
      displayName: 'Run build '
      inputs:
        command: custom
        workingDir: EurekaAngularProy
        verbose: false
        customCommand: 'run test --coverage'

    - task: SonarCloudPrepare@1
      condition: and(succeeded(), eq( '${{ parameters.runSonarTask}}' , true))
      inputs:
        SonarCloud: 'SCSonarCloudBie'
        organization: 'interbank'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'bie-pe.interbank.bie.cs-frontend:bie-cs-frontend'
        cliProjectName: 'bie-pe.interbank.bie.cs-frontend:bie-cs-frontend'
        cliSources: '.'
        extraProperties: |
          sonar.sourceEncoding=UTF-8
          sonar.sources=$(System.DefaultWorkingDirectory)/src
          sonar.exclusions = */node_modules/, */src/assets/*, */src/environments/*, */src/jest.config.ts, */src/main.ts
          sonar.tests=$(System.DefaultWorkingDirectory)/src
          sonar.test.inclusions=**/*.spec.ts
          sonar.typescript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/coverage/lcov.info
          sonar.c.file.suffixes=-
          sonar.cpp.file.suffixes=-
          sonar.objc.file.suffixes=-
      displayName: 'Prepare analysis on SonarCloud'

    - task: SonarCloudAnalyze@1
      condition: and(succeeded(), eq( '${{ parameters.runSonarTask}}' , true))
      displayName: 'Run Code Analysis'

    - task: SonarCloudPublish@1
      condition: and(succeeded(), eq( '${{ parameters.runSonarTask}}' , true))
      inputs:
        pollingTimeoutSec: '300'
      displayName: 'Publish Quality Gate Result'

