<!doctype html>
<html lang="es-PE" id="html-color">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-UA-Compatible" content="IE=100" />
    <meta http-equiv="Pragma" content="no-cache" />

    <title>Cobro Simple – Interbank</title>
    <meta
      name="description"
      content="Gestiona las cobranzas de tu negocio de manera 100% digital con Cobro Simple. Recibe el pago de tus clientes en nuestros canales Interbank."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cobro Simple – Interbank" />
    <meta
      property="og:image"
      itemprop="image"
      content="https://cobrosimple.dev.interbank.pe/assets/images/cs-share.png"
    />
    <meta
      property="og:description"
      content="Gestiona las cobranzas de tu negocio de manera 100% digital con Cobro Simple. Recibe el pago de tus clientes en nuestros canales Interbank."
    />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link rel="icon" type="image/x-icon" href="faviconIbk.ico" />
    <link
      rel="preload"
      href="https://cobrosimple.dev.interbank.pe/assets/images/bg-hero.webp"
      as="image"
    />
    <link
      rel="preload"
      href="https://cobrosimple.dev.interbank.pe/assets/images/img-laptop-home.webp"
      as="image"
    />
    <style type="text/css">
      .app-loading {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
      }

      .app-loading .spinner {
        height: 200px;
        width: 200px;
        animation: rotate 2s linear infinite;
        transform-origin: center center;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        margin: auto;
      }

      .app-loading .spinner .path {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
        animation: dash 1.5s ease-in-out infinite;
        stroke-linecap: round;
        stroke: #ddd;
      }

      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -35px;
        }
        100% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -124px;
        }
      }
    </style>
  </head>

  <body>
    <cs-root>
      <div class="app-loading">
        <div
          class="ngx-spinner-overlay"
          style="
            background-color: rgb(255, 255, 255);
            z-index: 99999;
            position: fixed;
            opacity: 1;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
          "
        >
          <div class="a-loader__spinner">
            <div class="a-loader__logo"></div>
          </div>
        </div>
      </div>
    </cs-root>
    <div class="overlay-app"></div>
  </body>
</html>
